seed: 0

# Model & tokenizer
model_path: /from_s3/models/Qwen2.5-Math-7B
dataset_path: /from_s3/datasets/deepscaler

# Which layer to hook
layer_idx: null

# Training
per_device_batch_size: 1
grad_accum_steps: 32
learning_rate: 1e-3
weight_decay: 0.0
warmup_steps: 0.03
mixed_precision: bf16
clip_grad_norm: 1.0

# Eval / logging
log_every_steps: 1

# Saving
savedir: results/

# Prompt formatting for tokenize_example
stop_token: <|im_end|>
max_seq_length: 4096
template_type: qwen_math

project: steering-reasoning
entity: turbo-alignment
group: ""
job_type: "online"
name: "vanilla"